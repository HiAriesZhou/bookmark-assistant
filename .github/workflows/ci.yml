name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# PR updates replace old work; main/develop commits use independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify PR changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          full=true
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only -z "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed-paths"
            full=false
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|CONTRIBUTING.md|AGENTS.md|CLAUDE.md|deploy/README.md|packages/extension/src/core/README.md|packages/server/src/core/README.md|packages/shared/README.md|packages/marketing/README.md) ;;
                *) full=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          printf 'full=%s\n' "$full" >> "$GITHUB_OUTPUT"

  self-hosted-container:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start a disposable self-hosted deployment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const password = crypto.randomBytes(24).toString('hex');
          const env = {
            POSTGRES_PASSWORD: password,
            DATABASE_URL: `postgresql://bookmark:${password}@database:5432/bookmark`,
            JWT_SECRET: crypto.randomBytes(32).toString('base64url'),
            NOTION_CLIENT_ID: 'fixture-client',
            NOTION_CLIENT_SECRET: 'fixture-client-secret',
            ALLOWED_EXTENSION_IDS: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
          };
          fs.writeFileSync('deploy/.env', Object.entries(env).map(([key, value]) => `${key}=${value}`).join('\n'));
          NODE
          docker compose --env-file deploy/.env -f deploy/compose.yml up --build -d
          for attempt in $(seq 1 60); do
            if docker compose --env-file deploy/.env -f deploy/compose.yml exec -T server node -e "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then break; fi
            if [ "$attempt" = 60 ]; then exit 1; fi
            sleep 2
          done
          docker compose --env-file deploy/.env -f deploy/compose.yml exec -T -e BOOKMARK_ASSISTANT_SMOKE=1 server node /workspace/deploy/smoke.mjs
      - name: Stop disposable containers
        if: always()
        run: docker compose --env-file deploy/.env -f deploy/compose.yml down
  migration-drift:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail when migrations and schema.prisma diverge
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:shadow@localhost:5432/shadow
        run: pnpm -F @bookmark-assistant/server prisma:check-drift

  lint-and-test:
    needs: changes
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require successful change classification
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check managed resources
        run: pnpm resources:check

      - name: Check public source and license boundaries
        run: pnpm source:check

      - name: Scan the history-free source candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/export-source-snapshot.mjs .build/audit-source
          mkdir -p .build/gitleaks
          cd .build/gitleaks
          curl -fsSL -o gitleaks_8.30.1_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd ../..
          .build/gitleaks/gitleaks dir .build/audit-source --redact=100 --no-banner --config .gitleaks.toml

      - name: Lint
        if: needs.changes.outputs.full == 'true'
        run: pnpm lint

      - name: Unit Tests
        if: needs.changes.outputs.full == 'true'
        run: pnpm vitest run --exclude='packages/server/**'

      - name: Server Tests
        if: needs.changes.outputs.full == 'true'
        run: pnpm -F @bookmark-assistant/server test

      - name: i18n Check
        if: needs.changes.outputs.full == 'true'
        run: pnpm check:i18n

  build-extension:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Extension
        run: |
          pnpm build
          pnpm build:prod
          node -e "const i=require('./packages/extension/dist/BUILD_INFO.json'); if(!i.officialBuild) throw new Error('Default production build must be the official build.')"

  website-quality:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: packages/website/.next/cache
          key: ${{ runner.os }}-node24-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint and build website
        run: |
          pnpm -F @bookmark-assistant/website lint
          pnpm -F @bookmark-assistant/website build

      - name: Run website smoke checks
        run: pnpm -F @bookmark-assistant/website smoke

  # The E2E script builds production output itself; no build-job artifact is consumed.
  extension-e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run extension E2E
        run: pnpm test:e2e:extension
