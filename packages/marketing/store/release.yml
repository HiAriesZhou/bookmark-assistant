privacy:
  singlePurpose: Bookmark Assistant helps users manage saved web pages through a local Chrome bookmark library, with optional synchronization to the user's own Notion workspace and optional folder suggestions from the user's own AI provider.
  permissionJustifications:
    activeTab: Used only after an explicit user action that saves the current page, such as Save current page in the popup or Save to Notion from the context menu while Notion is connected. It provides temporary access to the current tab’s title, URL and meta description. It is not used to monitor tabs or browsing activity in the background.
    alarms: Used to schedule the optional background sync the user turns on, without keeping the extension service worker continuously active. Alarms do not display notifications or track user activity.
    bookmarks: Used to display and manage the user’s Chrome bookmark library. This includes searching bookmarks, displaying the folder tree, detecting duplicate URLs, editing bookmark titles and URLs, moving bookmarks between folders, and deleting bookmarks at the user’s request. When the user connects a Destination and starts a sync, the required bookmark fields are prepared for that requested operation.
    contextMenus: Used to provide a Save to Notion action for a page or link only while a Notion Destination is connected. The action runs only when explicitly selected by the user, and the menu is removed when the Destination is disconnected.
    favicon: Used only to display each saved bookmark’s website icon in the local bookmark library. The extension retrieves these icons through Chrome’s built-in Favicon API for URLs already present in the user’s bookmarks. It is not used to track browsing activity.
    readingList: Used to read the user’s Chrome Reading List for local counts and optional user-initiated synchronization to a connected Destination. Bookmark Assistant does not use this permission to add, edit, or delete Reading List entries.
    scripting: Used only when the user saves the current page. Bookmark Assistant runs a packaged function in that tab to read the page’s meta description, which is saved with the link. It does not read the page body, download or execute remote code.
    storage: Used to store extension preferences, the user’s Notion token and selected database, bookmark descriptions and tags managed by Bookmark Assistant, cached local reports and sync state on the user’s device. This data stays in the browser, is sent only to Notion when the user syncs, and is not used for advertising or cross-site tracking.
  hostPermissionJustification: Optional host permissions for AI providers (OpenAI, Anthropic, Google Gemini, DeepSeek, Groq and MiniMax) are requested only when the user saves an API key for that provider to organize bookmarks, and are released when the key is removed or replaced. Requests carry only bookmark titles, folder paths and URLs without query strings.
  remoteCode:
    uses: false
    justification: null
  collectedData:
    - authenticationInformation
    - webHistory
    - websiteContent
  certifications:
    noSaleOrTransfer: true
    relatedToSinglePurpose: true
    noCreditworthinessUse: true
  policyUrl: https://www.bookmarkassistant.com/privacy
